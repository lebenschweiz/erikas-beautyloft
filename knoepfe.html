<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Knopf-Varianten</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e4dcd6;font-family:Montserrat,sans-serif;color:#4f4538;padding:30px 50px;max-width:1000px}
h1{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:34px;margin:10px 0 0}
p.hint{font-size:13px;color:#8a7d6c;margin:6px 0 10px}
.row{display:flex;align-items:center;gap:26px;padding:28px 0;border-bottom:1px solid rgba(187,133,9,.35)}
.lbl{width:200px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:30px}
.lbl small{display:block;font-family:Montserrat;font-style:normal;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#8a7d6c;margin-top:4px}
.photo{background:url(img/studio/studio-02.jpg) center/cover;border-radius:18px;padding:30px;display:flex;gap:20px}
a{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;transition:all .35s}
svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6}
@keyframes sh{0%,65%{left:-60%}100%{left:130%}}
/* 4 Glas */
.v4{padding:11px 22px;border-radius:40px;color:#3b342c;background:rgba(255,255,255,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 8px 24px rgba(47,42,37,.12)}
.v4::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent);transform:skewX(-20deg);animation:sh 4s ease-in-out infinite}
.v4:hover{background:rgba(255,255,255,.75);transform:translateY(-3px)}
.v4.o{background:transparent;box-shadow:inset 0 0 0 1px rgba(59,52,44,.35)}.v4.o::after{display:none}
.photo .v4{color:#fff;background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 8px 24px rgba(0,0,0,.2)}
/* 5 Minimal mit Linie */
.v5{padding:8px 2px;color:#3b342c;gap:14px}
.v5::before{content:"";position:absolute;left:0;bottom:2px;height:1px;width:100%;background:rgba(59,52,44,.35)}
.v5::after{content:"";position:absolute;left:0;bottom:2px;height:2px;width:0;background:#bb8509;transition:width .45s}
.v5:hover::after{width:100%}
.v5 .ar{width:28px;height:28px;border-radius:50%;border:1px solid rgba(59,52,44,.35);display:grid;place-items:center;transition:all .35s}
.v5:hover .ar{background:#3b342c;color:#fff;transform:translateX(5px)}
.v5.pulse .ar{animation:pu 2.4s ease-out infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(187,133,9,.45)}70%{box-shadow:0 0 0 10px rgba(187,133,9,0)}100%{box-shadow:0 0 0 0 rgba(187,133,9,0)}}
/* 6 Rosé-Verlauf */
.v6{padding:11px 22px;border-radius:40px;color:#fff;background:linear-gradient(120deg,#d9b8a8,#c49a88 50%,#d9b8a8);background-size:200% 100%;animation:gr 5s ease-in-out infinite;box-shadow:0 8px 22px rgba(160,120,105,.35)}
@keyframes gr{0%,100%{background-position:0 0}50%{background-position:100% 0}}
.v6:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(160,120,105,.45)}
.v6.o{background:transparent;animation:none;color:#9a7465;box-shadow:inset 0 0 0 1px #c49a88}
.v6.o:hover{background:rgba(255,255,255,.5)}
@media(max-width:700px){body{padding:20px 16px}.row{flex-wrap:wrap;gap:14px}.lbl{width:100%}.photo{flex-wrap:wrap}}
</style></head><body>
<h1>Новые варианты кнопок</h1><p class="hint">Наведите мышку на кнопку, чтобы увидеть эффект.</p>
<div class="row"><div class="lbl">Вариант 4<small>Стекло, прозрачные</small></div><a class="v4" href="#"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Jetzt buchen</a><a class="v4 o" href="#">Mehr erfahren</a></div>
<div class="row"><div class="lbl" style="font-size:22px">Вариант 4 на фото</div><div class="photo"><a class="v4" href="#"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Jetzt buchen</a></div></div>
<div class="row"><div class="lbl">Вариант 5<small>Минимализм, линия</small></div><a class="v5 pulse" href="#">Jetzt buchen<span class="ar"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="v5" href="#">Mehr erfahren<span class="ar"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></div>
<div class="row" style="border:0"><div class="lbl">Вариант 6<small>Розовое золото, перелив</small></div><a class="v6" href="#"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Jetzt buchen</a><a class="v6 o" href="#">Mehr erfahren</a></div>
</body></html>
